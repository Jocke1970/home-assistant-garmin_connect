name: Patch accessory battery entities

on:
  push:
    branches: [feature/garmin-fitness]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/garmin-fitness
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Patch accessory battery entities and tests
        run: |
          python - <<'PY'
          from pathlib import Path

          sensor_path = Path('custom_components/garmin_connect/sensor.py')
          test_path = Path('tests/test_sensor.py')
          sensor = sensor_path.read_text()
          tests = test_path.read_text()

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f'{label} anchor not found')
              return text.replace(old, new, 1)

          sensor = replace_once(
              sensor,
              'import datetime\n',
              'import datetime\nimport hashlib\n',
              'hashlib import',
          )

          setup_anchor = '''async def async_setup_entry(
              hass: HomeAssistant,
              entry: GarminConnectConfigEntry,
              async_add_entities: AddConfigEntryEntitiesCallback,
          ) -> None:
          '''
          helpers = '''_ACCESSORY_SENSOR_TYPE_NAMES = {
              "HEART_RATE": "Heart rate sensor",
              "BIKE_LIGHT_MAIN": "Bike light",
          }


          def _accessory_identity(sensor: dict[str, Any]) -> str:
              """Return a stable, non-reversible identity for an ANT+/BLE accessory."""
              serial = sensor.get("serialNumber")
              if serial not in (None, ""):
                  basis = f"serial:{serial}"
              else:
                  basis = "|".join(
                      str(sensor.get(key) or "")
                      for key in (
                          "sensorType",
                          "productId",
                          "partNumber",
                          "deviceName",
                          "manufacturer",
                      )
                  )
              return hashlib.sha256(basis.encode()).hexdigest()[:16]


          def _clean_gear_text(value: Any) -> str | None:
              """Return useful Gear branding text while dropping Garmin placeholders."""
              text = str(value or "").strip()
              if not text or text.lower() in {
                  "other",
                  "unknown",
                  "unknown bike",
                  "unknown shoes",
              }:
                  return None
              return text


          def _match_accessory_gear(
              accessory: dict[str, Any], gear_data: dict[str, Any]
          ) -> dict[str, Any] | None:
              """Conservatively match a Garmin accessory record to Gear v2 metadata.

              Garmin's recent-sensors endpoint does not expose the Gear UUID. For bike
              lights, a DURATION-tracked BIKE_COMPONENT is a strong signal. We only
              enrich when exactly one active candidate exists; ambiguous cases remain
              generic rather than guessing.
              """
              sensor_type = str(accessory.get("sensorType") or "").upper()
              if sensor_type != "BIKE_LIGHT_MAIN":
                  return None

              candidates = [
                  gear
                  for gear in gear_data.get("gearStats", [])
                  if isinstance(gear, dict)
                  and str(gear.get("status") or gear.get("gearStatusName") or "").upper()
                  == "ACTIVE"
                  and str(gear.get("gearType") or "").upper() == "BIKE_COMPONENT"
                  and str(gear.get("usageType") or "").upper() == "DURATION"
              ]
              return candidates[0] if len(candidates) == 1 else None


          def _accessory_metadata(
              accessory: dict[str, Any], gear_data: dict[str, Any]
          ) -> dict[str, str | None]:
              """Build display metadata without exposing accessory identifiers."""
              gear = _match_accessory_gear(accessory, gear_data)
              if gear is not None:
                  brand = _clean_gear_text(gear.get("brand") or gear.get("gearMakeName"))
                  model = _clean_gear_text(gear.get("model") or gear.get("gearModelName"))
                  custom = _clean_gear_text(gear.get("customMakeModel"))
                  display_name = " ".join(part for part in (brand, model) if part)
                  if not display_name:
                      display_name = custom or "Garmin accessory"
                  return {
                      "name": display_name,
                      "manufacturer": brand,
                      "model": model,
                      "gear_uuid": str(gear.get("uuid") or gear.get("gearUuid") or "") or None,
                  }

              sensor_type = str(accessory.get("sensorType") or "UNKNOWN").upper()
              display_name = str(accessory.get("deviceName") or "").strip()
              if not display_name:
                  display_name = _ACCESSORY_SENSOR_TYPE_NAMES.get(
                      sensor_type, sensor_type.replace("_", " ").title()
                  )
              manufacturer = str(accessory.get("manufacturer") or "").strip() or None
              model = str(accessory.get("partNumber") or "").strip() or None
              return {
                  "name": display_name,
                  "manufacturer": manufacturer,
                  "model": model,
                  "gear_uuid": None,
              }


          ''' + setup_anchor
          sensor = replace_once(sensor, setup_anchor, helpers, 'accessory helpers')

          sensor = replace_once(
              sensor,
              '''    entities: list[
                  GarminConnectSensor | GarminConnectGearSensor | GarminConnectPowerToWeightSensor
              ] = []
          ''',
              '''    entities: list[
                  GarminConnectSensor
                  | GarminConnectGearSensor
                  | GarminConnectAccessoryBatterySensor
                  | GarminConnectPowerToWeightSensor
              ] = []
          ''',
              'entity union',
          )

          initial_anchor = '''    @callback
              def _async_add_new_gear() -> None:
          '''
          accessory_setup = '''    # Dynamic ANT+/BLE accessory battery entities. Battery percentage and
              # qualitative battery status are separate entities because Garmin may provide
              # either one independently (for example, bike lights can be status-only).
              known_accessory_entities: set[tuple[str, str]] = set()

              def _collect_new_accessory_entities() -> list[GarminConnectAccessoryBatterySensor]:
                  if not coordinators.gear.data:
                      return []
                  new_entities: list[GarminConnectAccessoryBatterySensor] = []
                  for accessory in coordinators.gear.data.get("sensors", []):
                      if not isinstance(accessory, dict):
                          continue
                      accessory_key = _accessory_identity(accessory)
                      battery_level = accessory.get("batteryLevel")
                      battery_status = accessory.get("batteryStatus")
                      kinds: list[str] = []
                      if isinstance(battery_level, int | float) and not isinstance(
                          battery_level, bool
                      ):
                          kinds.append("level")
                      if isinstance(battery_status, str) and battery_status:
                          kinds.append("status")
                      for kind in kinds:
                          token = (accessory_key, kind)
                          if token in known_accessory_entities:
                              continue
                          known_accessory_entities.add(token)
                          new_entities.append(
                              GarminConnectAccessoryBatterySensor(
                                  coordinators.gear,
                                  accessory_key=accessory_key,
                                  kind=kind,
                                  entry_id=entry.entry_id,
                              )
                          )
                  return new_entities

              entities.extend(_collect_new_accessory_entities())

          ''' + initial_anchor
          sensor = replace_once(sensor, initial_anchor, accessory_setup, 'accessory setup')

          listener_anchor = '''    entry.async_on_unload(coordinators.gear.async_add_listener(_async_add_new_gear))

              # Dynamic power-to-weight sensors (one PTW + one FTP sensor per sport)
          '''
          listener_replacement = '''    entry.async_on_unload(coordinators.gear.async_add_listener(_async_add_new_gear))

              @callback
              def _async_add_new_accessory_battery() -> None:
                  """Add battery entities when Garmin starts reporting a new accessory/value."""
                  new_entities = _collect_new_accessory_entities()
                  if new_entities:
                      async_add_entities(new_entities)

              entry.async_on_unload(
                  coordinators.gear.async_add_listener(_async_add_new_accessory_battery)
              )

              # Dynamic power-to-weight sensors (one PTW + one FTP sensor per sport)
          '''
          sensor = replace_once(sensor, listener_anchor, listener_replacement, 'accessory listener')

          class_anchor = '''class GarminConnectGearSensor(CoordinatorEntity[GearCoordinator], SensorEntity):
          '''
          accessory_class = '''class GarminConnectAccessoryBatterySensor(
              CoordinatorEntity[GearCoordinator], SensorEntity
          ):
              """Battery percentage or status for a recent Garmin ANT+/BLE accessory."""

              _attr_has_entity_name = True
              _attr_entity_category = EntityCategory.DIAGNOSTIC

              def __init__(
                  self,
                  coordinator: GearCoordinator,
                  accessory_key: str,
                  kind: str,
                  entry_id: str,
              ) -> None:
                  """Initialize an accessory battery entity."""
                  super().__init__(coordinator)
                  self._accessory_key = accessory_key
                  self._kind = kind
                  self._attr_unique_id = (
                      f"{entry_id}_accessory_{accessory_key}_battery_{kind}"
                  )
                  self._attr_name = "Battery" if kind == "level" else "Battery status"

                  if kind == "level":
                      self._attr_native_unit_of_measurement = PERCENTAGE
                      self._attr_device_class = SensorDeviceClass.BATTERY
                      self._attr_state_class = SensorStateClass.MEASUREMENT
                      self._attr_suggested_display_precision = 0

                  accessory = self._get_accessory() or {}
                  metadata = _accessory_metadata(accessory, coordinator.data or {})
                  device_info = DeviceInfo(
                      identifiers={(DOMAIN, f"accessory_{accessory_key}")},
                      name=metadata["name"] or "Garmin accessory",
                  )
                  if metadata["manufacturer"]:
                      device_info["manufacturer"] = metadata["manufacturer"]
                  if metadata["model"]:
                      device_info["model"] = metadata["model"]
                  software_version = accessory.get("softwareVersion")
                  if software_version not in (None, ""):
                      device_info["sw_version"] = str(software_version)
                  self._attr_device_info = device_info

              def _get_accessory(self) -> dict[str, Any] | None:
                  """Return the current Garmin accessory record for this stable key."""
                  if not self.coordinator.data:
                      return None
                  for accessory in self.coordinator.data.get("sensors", []):
                      if isinstance(accessory, dict) and _accessory_identity(accessory) == self._accessory_key:
                          return accessory
                  return None

              @property
              def native_value(self) -> str | int | float | None:
                  """Return battery percentage or Garmin's qualitative battery status."""
                  accessory = self._get_accessory()
                  if accessory is None:
                      return None
                  if self._kind == "level":
                      value = accessory.get("batteryLevel")
                      if isinstance(value, int | float) and not isinstance(value, bool):
                          return value
                      return None
                  value = accessory.get("batteryStatus")
                  return value if isinstance(value, str) and value else None

              @property
              def extra_state_attributes(self) -> dict[str, Any]:
                  """Return useful accessory metadata while keeping identifiers private."""
                  accessory = self._get_accessory()
                  if accessory is None:
                      return {}
                  metadata = _accessory_metadata(accessory, self.coordinator.data or {})
                  return {
                      key: value
                      for key, value in {
                          "sensor_type": accessory.get("sensorType"),
                          "battery_level": accessory.get("batteryLevel"),
                          "battery_status": accessory.get("batteryStatus"),
                          "last_connected": accessory.get("lastConnected"),
                          "last_low_battery_notification": accessory.get(
                              "lastLowBatteryNotification"
                          ),
                          "rechargeable_sensor_capable": accessory.get(
                              "rechargeableSensorCapable"
                          ),
                          "gear_uuid": metadata.get("gear_uuid"),
                          "gear_brand": metadata.get("manufacturer"),
                          "gear_model": metadata.get("model"),
                      }.items()
                      if value is not None
                  }


          ''' + class_anchor
          sensor = replace_once(sensor, class_anchor, accessory_class, 'accessory class')

          tests = replace_once(
              tests,
              '''    CoordinatorType,
                  GarminConnectGearSensor,
          ''',
              '''    CoordinatorType,
                  GarminConnectAccessoryBatterySensor,
                  GarminConnectGearSensor,
                  _accessory_identity,
                  _match_accessory_gear,
          ''',
              'test imports',
          )

          test_anchor = '''# ── GarminConnectGearSensor ───────────────────────────────────────────────────
          '''
          accessory_tests = '''# ── GarminConnectAccessoryBatterySensor ──────────────────────────────────────


          def _bontrager_accessory_data() -> dict:
              return {
                  "sensors": [
                      {
                          "sensorType": "BIKE_LIGHT_MAIN",
                          "serialNumber": "bontrager-secret-serial",
                          "batteryLevel": None,
                          "batteryStatus": "OK",
                          "lastConnected": "2026-09-05T12:51:00+00:00",
                          "softwareVersion": "1.2",
                      }
                  ],
                  "gearStats": [
                      {
                          "uuid": "chain",
                          "status": "ACTIVE",
                          "gearType": "BIKE_COMPONENT",
                          "usageType": "DISTANCE",
                          "brand": "Shimano",
                          "model": "CN-HG701",
                      },
                      {
                          "uuid": "bontrager",
                          "status": "ACTIVE",
                          "gearType": "BIKE_COMPONENT",
                          "usageType": "DURATION",
                          "brand": "Bontrager",
                          "model": "Ion 200 RT Flare",
                      },
                  ],
              }


          def test_accessory_bike_light_matches_unique_duration_bike_component() -> None:
              """BIKE_LIGHT_MAIN enriches only from one unambiguous active Gear candidate."""
              data = _bontrager_accessory_data()
              gear = _match_accessory_gear(data["sensors"][0], data)
              assert gear is not None
              assert gear["uuid"] == "bontrager"
              assert gear["brand"] == "Bontrager"
              assert gear["model"] == "Ion 200 RT Flare"


          def test_accessory_identity_hashes_serial_number() -> None:
              """Accessory unique identity must be stable without exposing the serial."""
              accessory = _bontrager_accessory_data()["sensors"][0]
              key = _accessory_identity(accessory)
              assert key == _accessory_identity(accessory)
              assert "bontrager-secret-serial" not in key
              assert len(key) == 16


          def test_accessory_status_entity_uses_gear_brand_and_model() -> None:
              """Status-only bike light gets Bontrager Gear metadata without invented percent."""
              coord = MagicMock()
              coord.data = _bontrager_accessory_data()
              key = _accessory_identity(coord.data["sensors"][0])
              sensor = GarminConnectAccessoryBatterySensor(
                  coord, accessory_key=key, kind="status", entry_id="eid"
              )

              assert sensor.native_value == "OK"
              assert sensor.native_unit_of_measurement is None
              assert sensor.device_class is None
              assert sensor._attr_device_info["name"] == "Bontrager Ion 200 RT Flare"
              assert sensor._attr_device_info["manufacturer"] == "Bontrager"
              assert sensor._attr_device_info["model"] == "Ion 200 RT Flare"
              assert sensor.extra_state_attributes["gear_uuid"] == "bontrager"
              assert "serialNumber" not in sensor.extra_state_attributes


          def test_accessory_percentage_entity_is_real_battery_sensor() -> None:
              """Battery percentage becomes a normal HA battery measurement entity."""
              coord = MagicMock()
              coord.data = {
                  "sensors": [
                      {
                          "sensorType": "HEART_RATE",
                          "serialNumber": "hr-secret-serial",
                          "batteryLevel": 75,
                          "batteryStatus": "OK",
                      }
                  ],
                  "gearStats": [],
              }
              key = _accessory_identity(coord.data["sensors"][0])
              sensor = GarminConnectAccessoryBatterySensor(
                  coord, accessory_key=key, kind="level", entry_id="eid"
              )

              assert sensor.native_value == 75
              assert sensor.native_unit_of_measurement == "%"
              assert sensor.device_class == SensorDeviceClass.BATTERY
              assert sensor.extra_state_attributes["battery_status"] == "OK"
              assert "hr-secret-serial" not in sensor._attr_unique_id


          ''' + test_anchor
          tests = replace_once(tests, test_anchor, accessory_tests, 'accessory tests')

          sensor_path.write_text(sensor)
          test_path.write_text(tests)
          PY

      - name: Install test dependencies
        run: pip install -r requirements.txt -r requirements_lint.txt

      - name: Format and validate
        run: |
          pre-commit run --all-files --hook-stage manual --config .github/pre-commit-config.yaml
          pytest tests/test_sensor.py -q

      - name: Commit patch and remove one-shot workflow
        run: |
          rm .github/workflows/patch-accessory-battery.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add Garmin accessory battery entities'
          git push origin feature/garmin-fitness
