name: Patch accessory battery entities v3

on:
  push:
    branches: [feature/garmin-fitness]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/garmin-fitness
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Apply accessory battery patch
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/patch-accessory-battery.yml').read_text()
          marker = "python - <<'PY'\n"
          script = workflow.split(marker, 1)[1].split("\n          PY", 1)[0]
          script = dedent(script)

          script = script.replace(
              "'''    CoordinatorType,\n        GarminConnectGearSensor,\n'''",
              "'    CoordinatorType,\\n    GarminConnectGearSensor,\\n'",
          )
          script = script.replace(
              "'''    CoordinatorType,\n        GarminConnectAccessoryBatterySensor,\n        GarminConnectGearSensor,\n        _accessory_identity,\n        _match_accessory_gear,\n'''",
              "'    CoordinatorType,\\n    GarminConnectAccessoryBatterySensor,\\n    GarminConnectGearSensor,\\n    _accessory_identity,\\n    _match_accessory_gear,\\n'",
          )
          exec(compile(script, 'accessory_patch', 'exec'))
          PY

      - name: Install test dependencies
        run: pip install -r requirements.txt -r requirements_lint.txt

      - name: Format and validate
        run: |
          ruff check --fix custom_components/garmin_connect/sensor.py tests/test_sensor.py
          ruff format custom_components/garmin_connect/sensor.py tests/test_sensor.py
          pre-commit run --all-files --hook-stage manual --config .github/pre-commit-config.yaml
          pytest tests/test_sensor.py -q

      - name: Commit patch and clean temporary workflows
        run: |
          rm -f .github/workflows/patch-accessory-battery.yml
          rm -f .github/workflows/patch-accessory-battery-v3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add Garmin accessory battery entities'
          git push origin feature/garmin-fitness
