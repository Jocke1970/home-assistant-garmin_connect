name: Gear M2 registered device battery temp

on:
  push:
    branches:
      - feature/garmin-gear
    paths:
      - .gear-m2-device-battery

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Patch HA registered-device battery entities
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          sensor = Path("custom_components/garmin_connect/sensor.py")
          text = sensor.read_text(encoding="utf-8")

          anchor = '''    return hashlib.sha256(basis.encode()).hexdigest()[:16]\n\n\ndef _clean_gear_text(value: Any) -> str | None:\n'''
          replacement = '''    return hashlib.sha256(basis.encode()).hexdigest()[:16]\n\n\ndef _registered_device_identity(device: dict[str, Any]) -> str:\n    """Return a stable, non-reversible identity for a registered Garmin device."""\n    device_id = device.get("deviceId")\n    unit_id = device.get("unitId")\n    basis_value = device_id if device_id not in (None, "") else unit_id\n    if basis_value in (None, ""):\n        basis_value = "|".join(\n            str(device.get(key) or "")\n            for key in ("applicationKey", "productSku", "displayName")\n        )\n    return hashlib.sha256(f"device:{basis_value}".encode()).hexdigest()[:16]\n\n\ndef _clean_gear_text(value: Any) -> str | None:\n'''
          assert anchor in text, "registered device identity anchor not found"
          text = text.replace(anchor, replacement, 1)

          anchor = '''        GarminConnectGearSensor\n        | GarminConnectAccessoryBatterySensor\n        | GarminConnectPowerToWeightSensor\n'''
          replacement = '''        GarminConnectGearSensor\n        | GarminConnectDeviceBatterySensor\n        | GarminConnectAccessoryBatterySensor\n        | GarminConnectPowerToWeightSensor\n'''
          assert anchor in text, "entity union anchor not found"
          text = text.replace(anchor, replacement, 1)

          anchor = '''    # Dynamic ANT+/BLE accessory battery entities. Battery percentage and\n    # qualitative battery status are separate entities because Garmin may provide\n    # either one independently (for example, bike lights can be status-only).\n'''
          replacement = '''    # Dynamic registered Garmin-device battery entities. Garmin's device endpoint\n    # may provide a numeric percentage, a qualitative status, or both.\n    known_device_battery_entities: set[tuple[str, str]] = set()\n\n    def _collect_new_device_battery_entities() -> list[GarminConnectDeviceBatterySensor]:\n        if not coordinators.gear.data:\n            return []\n        new_entities: list[GarminConnectDeviceBatterySensor] = []\n        for device in coordinators.gear.data.get("devices", []):\n            if not isinstance(device, dict):\n                continue\n            device_key = _registered_device_identity(device)\n            battery_level = device.get("batteryLevel")\n            battery_status = device.get("batteryStatus")\n            kinds: list[str] = []\n            if isinstance(battery_level, int | float) and not isinstance(battery_level, bool):\n                kinds.append("level")\n            if isinstance(battery_status, str) and battery_status:\n                kinds.append("status")\n            for kind in kinds:\n                token = (device_key, kind)\n                if token in known_device_battery_entities:\n                    continue\n                known_device_battery_entities.add(token)\n                new_entities.append(\n                    GarminConnectDeviceBatterySensor(\n                        coordinators.gear,\n                        device_key=device_key,\n                        kind=kind,\n                        entry_id=entry.entry_id,\n                    )\n                )\n        return new_entities\n\n    entities.extend(_collect_new_device_battery_entities())\n\n    # Dynamic ANT+/BLE accessory battery entities. Battery percentage and\n    # qualitative battery status are separate entities because Garmin may provide\n    # either one independently (for example, bike lights can be status-only).\n'''
          assert anchor in text, "dynamic accessory anchor not found"
          text = text.replace(anchor, replacement, 1)

          anchor = '''    entry.async_on_unload(coordinators.gear.async_add_listener(_async_add_new_gear))\n\n    @callback\n    def _async_add_new_accessory_battery() -> None:\n'''
          replacement = '''    entry.async_on_unload(coordinators.gear.async_add_listener(_async_add_new_gear))\n\n    @callback\n    def _async_add_new_registered_device_battery() -> None:\n        """Add battery entities when Garmin starts reporting a device value."""\n        new_entities = _collect_new_device_battery_entities()\n        if new_entities:\n            async_add_entities(new_entities)\n\n    entry.async_on_unload(\n        coordinators.gear.async_add_listener(_async_add_new_registered_device_battery)\n    )\n\n    @callback\n    def _async_add_new_accessory_battery() -> None:\n'''
          assert anchor in text, "battery listener anchor not found"
          text = text.replace(anchor, replacement, 1)

          anchor = '''class GarminConnectAccessoryBatterySensor(CoordinatorEntity[GearCoordinator], SensorEntity):\n'''
          replacement = '''class GarminConnectDeviceBatterySensor(CoordinatorEntity[GearCoordinator], SensorEntity):\n    """Battery percentage or status for a registered Garmin device."""\n\n    _attr_has_entity_name = True\n    _attr_entity_category = EntityCategory.DIAGNOSTIC\n\n    def __init__(\n        self,\n        coordinator: GearCoordinator,\n        device_key: str,\n        kind: str,\n        entry_id: str,\n    ) -> None:\n        """Initialize a registered-device battery entity."""\n        super().__init__(coordinator)\n        self._device_key = device_key\n        self._kind = kind\n        self._attr_unique_id = f"{entry_id}_device_{device_key}_battery_{kind}"\n        self._attr_name = "Battery" if kind == "level" else "Battery status"\n\n        if kind == "level":\n            self._attr_native_unit_of_measurement = PERCENTAGE\n            self._attr_device_class = SensorDeviceClass.BATTERY\n            self._attr_state_class = SensorStateClass.MEASUREMENT\n            self._attr_suggested_display_precision = 0\n\n        device = self._get_device() or {}\n        display_name = str(\n            device.get("productDisplayName") or device.get("displayName") or "Garmin device"\n        ).strip()\n        model = str(\n            device.get("productDisplayName") or device.get("deviceTypeName") or ""\n        ).strip()\n        device_info = DeviceInfo(\n            identifiers={(DOMAIN, f"registered_device_{device_key}")},\n            name=display_name or "Garmin device",\n            manufacturer="Garmin",\n        )\n        if model:\n            device_info["model"] = model\n        firmware = device.get("currentFirmwareVersion")\n        if firmware not in (None, ""):\n            device_info["sw_version"] = str(firmware)\n        self._attr_device_info = device_info\n\n    def _get_device(self) -> dict[str, Any] | None:\n        """Return the current Garmin registered-device record for this key."""\n        if not self.coordinator.data:\n            return None\n        for device in self.coordinator.data.get("devices", []):\n            if (\n                isinstance(device, dict)\n                and _registered_device_identity(device) == self._device_key\n            ):\n                return device\n        return None\n\n    @property\n    def native_value(self) -> str | int | float | None:\n        """Return battery percentage or Garmin's qualitative battery status."""\n        device = self._get_device()\n        if device is None:\n            return None\n        if self._kind == "level":\n            value = device.get("batteryLevel")\n            if isinstance(value, int | float) and not isinstance(value, bool):\n                return value\n            return None\n        value = device.get("batteryStatus")\n        return value if isinstance(value, str) and value else None\n\n    @property\n    def extra_state_attributes(self) -> dict[str, Any]:\n        """Return useful registered-device metadata without serial numbers."""\n        device = self._get_device()\n        if device is None:\n            return {}\n        return {\n            key: value\n            for key, value in {\n                "battery_level": device.get("batteryLevel"),\n                "battery_status": device.get("batteryStatus"),\n                "device_status": device.get("deviceStatus"),\n                "firmware": device.get("currentFirmwareVersion"),\n                "application_key": device.get("applicationKey"),\n                "product_sku": device.get("productSku"),\n            }.items()\n            if value is not None\n        }\n\n\nclass GarminConnectAccessoryBatterySensor(CoordinatorEntity[GearCoordinator], SensorEntity):\n'''
          assert anchor in text, "accessory class anchor not found"
          text = text.replace(anchor, replacement, 1)

          sensor.write_text(text, encoding="utf-8")

          tests = Path("tests/test_sensor.py")
          text = tests.read_text(encoding="utf-8")
          text = text.replace(
              "    GarminConnectAccessoryBatterySensor,\n    GarminConnectGearSensor,",
              "    GarminConnectAccessoryBatterySensor,\n    GarminConnectDeviceBatterySensor,\n    GarminConnectGearSensor,",
              1,
          )
          text = text.replace(
              "    _accessory_identity,\n    _match_accessory_gear,",
              "    _accessory_identity,\n    _match_accessory_gear,\n    _registered_device_identity,",
              1,
          )

          anchor = '''# ── GarminConnectAccessoryBatterySensor ──────────────────────────────────────\n'''
          addition = '''# ── GarminConnectDeviceBatterySensor ─────────────────────────────────────────\n\n\ndef _registered_device_battery_data() -> dict:\n    return {\n        "devices": [\n            {\n                "deviceId": 12345,\n                "displayName": "fenix 7 Pro Sapphire Solar",\n                "productDisplayName": "fenix 7 Pro Sapphire Solar",\n                "batteryLevel": 64,\n                "batteryStatus": "GOOD",\n                "deviceStatus": "ACTIVE",\n                "currentFirmwareVersion": "25.12",\n                "applicationKey": "fenix7pro",\n            }\n        ]\n    }\n\n\ndef test_registered_device_battery_level_entity() -> None:\n    coord = MagicMock()\n    coord.data = _registered_device_battery_data()\n    key = _registered_device_identity(coord.data["devices"][0])\n    sensor = GarminConnectDeviceBatterySensor(\n        coord, device_key=key, kind="level", entry_id="eid"\n    )\n\n    assert sensor.native_value == 64\n    assert sensor.native_unit_of_measurement == "%"\n    assert sensor.device_class == SensorDeviceClass.BATTERY\n    assert sensor.extra_state_attributes["battery_status"] == "GOOD"\n\n\ndef test_registered_device_battery_status_entity() -> None:\n    coord = MagicMock()\n    coord.data = _registered_device_battery_data()\n    key = _registered_device_identity(coord.data["devices"][0])\n    sensor = GarminConnectDeviceBatterySensor(\n        coord, device_key=key, kind="status", entry_id="eid"\n    )\n\n    assert sensor.native_value == "GOOD"\n    assert sensor.native_unit_of_measurement is None\n    assert sensor._attr_device_info["name"] == "fenix 7 Pro Sapphire Solar"\n    assert sensor._attr_device_info["sw_version"] == "25.12"\n\n\n# ── GarminConnectAccessoryBatterySensor ──────────────────────────────────────\n'''
          assert anchor in text, "test accessory section anchor not found"
          text = text.replace(anchor, addition, 1)
          tests.write_text(text, encoding="utf-8")

          manifest = Path("custom_components/garmin_connect/manifest.json")
          text = manifest.read_text(encoding="utf-8")
          old_sha = "b06ffad8bb4a4e785b0b1d057b9d7df00b84d033"
          new_sha = "250472613761295d53d7eeeaaa82055af745ed06"
          assert old_sha in text, "old ha-garmin pin not found"
          text = text.replace(old_sha, new_sha, 1)
          text = text.replace(
              '"version": "3.0.23-gear-m1.1"',
              '"version": "3.0.24-gear-m2.0-dev.1"',
              1,
          )
          manifest.write_text(text, encoding="utf-8")
          PY

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements_lint.txt

      - name: Pre-commit
        run: pre-commit run --all-files --hook-stage manual --config .github/pre-commit-config.yaml

      - name: Targeted tests
        run: pytest tests/test_sensor.py tests/test_gear_engine.py -q

      - name: Remove one-shot files and commit
        shell: bash
        run: |
          rm -f .gear-m2-device-battery .github/workflows/gear-m2-device-battery-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(gear): expose registered-device battery sensors"
          git push
