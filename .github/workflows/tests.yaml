name: Tests

on:
  push:
    branches:
      - main
      - ng
      - feature/garmin-fitness
      - feature/garmin-fitness-handoff
  pull_request:
    branches:
      - main
      - ng
  workflow_dispatch:

permissions:
  contents: write

jobs:
  autofix:
    name: Ruff runtime autofix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install ruff==0.16.3
      - name: Fix runtime test lint
        run: ruff check --fix tests/test_fitness_runtime.py
      - name: Commit formatter result
        run: |
          if git diff --quiet; then
            echo "No formatter changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_fitness_runtime.py
          git commit -m "style(fitness): apply runtime test ruff fixes"
          git push
