name: Tests

on:
  push:
    branches:
      - main
      - ng
      - feature/garmin-fitness
      - feature/garmin-fitness-handoff
  pull_request:
    branches:
      - main
      - ng
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Pre-commit checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt -r requirements_lint.txt
      - name: Codespell
        run: pre-commit run codespell --all-files --hook-stage manual --config .github/pre-commit-config.yaml
      - name: Pyupgrade
        run: pre-commit run pyupgrade --all-files --hook-stage manual --config .github/pre-commit-config.yaml
      - name: Ruff
        run: pre-commit run ruff-check --all-files --hook-stage manual --config .github/pre-commit-config.yaml
      - name: Mypy
        run: pre-commit run mypy --all-files --hook-stage manual --config .github/pre-commit-config.yaml
      - name: YAML
        run: pre-commit run check-yaml --all-files --hook-stage manual --config .github/pre-commit-config.yaml
      - name: JSON
        run: pre-commit run check-json --all-files --hook-stage manual --config .github/pre-commit-config.yaml
      - name: AST
        run: pre-commit run check-ast --all-files --hook-stage manual --config .github/pre-commit-config.yaml
      - name: Line endings
        run: pre-commit run mixed-line-ending --all-files --hook-stage manual --config .github/pre-commit-config.yaml

  tests:
    name: Pytest
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt -r requirements_lint.txt
      - run: pytest tests/ -q
