name: Gear M2 battery verify temp

on:
  push:
    branches:
      - feature/garmin-gear
    paths:
      - .gear-m2-battery-verify

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install pinned dependencies
        run: pip install -r requirements.txt -r requirements_lint.txt
      - name: Verify pinned ha-garmin battery plumbing
        shell: bash
        run: |
          python - <<'PY'
          from ha_garmin.client import _trim_device
          from ha_garmin.gear import build_gear_source_records

          raw = {
              "deviceId": 123,
              "productDisplayName": "Fenix 7 Pro",
              "batteryLevel": 64,
              "batteryStatus": "GOOD",
          }
          trimmed = _trim_device(raw)
          assert trimmed["batteryLevel"] == 64
          assert trimmed["batteryStatus"] == "GOOD"
          record = build_gear_source_records({"devices": [trimmed]})[0]
          assert record["metadata"]["battery_level"] == 64
          assert record["metadata"]["battery_status"] == "GOOD"
          PY
      - name: Pre-commit
        run: pre-commit run --all-files --hook-stage manual --config .github/pre-commit-config.yaml
      - name: Targeted tests
        run: pytest tests/test_sensor.py tests/test_gear_engine.py -q
      - name: Remove one-shot files and commit cleanup
        shell: bash
        run: |
          rm -f .gear-m2-battery-verify .github/workflows/gear-m2-battery-verify-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore(gear): finish battery dev.1 verification"
          git push
