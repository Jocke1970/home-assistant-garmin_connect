name: One-shot Port Gear to Fitness

# One-shot helper; removed after a successful port.
on:
  push:
    paths:
      - ".github/workflows/port-gear-to-fitness.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Fitness branch
        uses: actions/checkout@v4
        with:
          ref: feature/garmin-fitness
          fetch-depth: 0

      - name: Port Gear activity metadata
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest_path = Path("custom_components/garmin_connect/manifest.json")
          manifest = json.loads(manifest_path.read_text())
          manifest["requirements"] = [
              "ha-garmin@git+https://github.com/Jocke1970/ha-garmin.git@997fa7f600652bbc0c452b421eaffb5f4ba54203"
          ]
          manifest["version"] = "3.0.17-fitness-probe.7"
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")

          sensor_path = Path("custom_components/garmin_connect/sensor.py")
          sensor = sensor_path.read_text()
          old_sensor = '''                    "default_for_activity": gear_stat.get("defaultForActivity", []),
          '''
          new_sensor = '''                    "default_for_activity": gear_stat.get("defaultForActivity", []),
                              "default_for_activity_details": gear_stat.get(
                                  "defaultForActivityDetails", []
                              ),
                              "last_activity": gear_stat.get("lastActivity"),
          '''
          if "default_for_activity_details" not in sensor:
              if old_sensor not in sensor:
                  raise SystemExit("Expected Gear attribute block not found in sensor.py")
              sensor_path.write_text(sensor.replace(old_sensor, new_sensor, 1))

          init_path = Path("custom_components/garmin_connect/__init__.py")
          init = init_path.read_text()
          old_init = '''    await asyncio.gather(
                  coordinators.activity.async_refresh(),
                  coordinators.training.async_refresh(),
                  coordinators.body.async_refresh(),
                  coordinators.goals.async_refresh(),
                  coordinators.gear.async_refresh(),
                  coordinators.blood_pressure.async_refresh(),
                  coordinators.menstrual.async_refresh(),
                  coordinators.nutrition.async_refresh(),
                  fitness.async_refresh(),
                  return_exceptions=True,
              )
          '''
          new_init = '''    # Activity teaches the shared client which gear was used most recently.
              # Prime it before Gear so last_activity is available on the first Gear
              # refresh after Home Assistant starts. Keep it best-effort, matching the
              # previous parallel-refresh behaviour.
              await asyncio.gather(
                  coordinators.activity.async_refresh(),
                  return_exceptions=True,
              )

              await asyncio.gather(
                  coordinators.training.async_refresh(),
                  coordinators.body.async_refresh(),
                  coordinators.goals.async_refresh(),
                  coordinators.gear.async_refresh(),
                  coordinators.blood_pressure.async_refresh(),
                  coordinators.menstrual.async_refresh(),
                  coordinators.nutrition.async_refresh(),
                  fitness.async_refresh(),
                  return_exceptions=True,
              )
          '''
          if "Activity teaches the shared client" not in init:
              if old_init not in init:
                  raise SystemExit("Expected startup refresh block not found in __init__.py")
              init_path.write_text(init.replace(old_init, new_init, 1))

          print("Gear backend ported to feature/garmin-fitness")
          PY

      - name: Commit to Fitness branch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/garmin_connect/manifest.json \
                  custom_components/garmin_connect/sensor.py \
                  custom_components/garmin_connect/__init__.py
          git commit -m "feat: add Gear activity metadata to Fitness probe"
          git push origin HEAD:feature/garmin-fitness
