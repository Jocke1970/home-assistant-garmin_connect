name: Release Garmin Fitness probe 16

on:
  push:
    branches:
      - feature/garmin-fitness
    paths:
      - .github/workflows/release-probe16.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: 3.0.22-fitness-probe.16
          TARGET: 6eea24fdb21f821094ac34777ac77baf7a69967c
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET" \
            --title "Garmin Fitness + Gear probe 16 – ANT+/BLE sensor battery data" \
            --notes "Syncs the Fitness probe to ha-garmin a66423d, adding recent ANT+/BLE sensor battery data to the existing Garmin Gear data flow while preserving Garmin Fitness Load Focus v1 unchanged. Load Focus remains the transparent Training Effect-derived low aerobic / high aerobic / anaerobic model introduced in probe 15, with 90-day Long-Term Statistics backfill and strict incomplete-data handling. Also preserves Strain, ACWR, Ramp, CTL/ATL/TSB, warm-up recovery, Gear v2 usage, recent Gear activity support and Garmin device battery diagnostics."
