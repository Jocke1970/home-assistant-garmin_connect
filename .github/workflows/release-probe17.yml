name: Release Garmin Fitness probe 17

on:
  push:
    branches: [feature/garmin-fitness]

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      TAG: 3.0.22-fitness-probe.17
      TARGET_SHA: 956738e19df7477e94dfe644e6e29f5f6fe3fb80
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/garmin-fitness
          fetch-depth: 0

      - name: Tag tested commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag "$TAG" "$TARGET_SHA"
          git push origin "$TAG"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "Garmin Fitness + Gear probe 17 – Accessory battery entities" \
            --notes "Adds dynamic Home Assistant battery entities for recent Garmin ANT+/BLE accessories. Numeric battery levels are exposed as normal percentage battery sensors, while accessories that only report Garmin battery status keep that qualitative status without inventing a percentage. Bike-light sensor data is conservatively enriched from a unique active DURATION-tracked BIKE_COMPONENT Gear record, allowing the current Bontrager Ion 200 RT Flare to receive its Garmin Gear brand/model while ambiguous matches remain generic. Accessory serial numbers are hashed for stable internal identity and are not exposed in entity metadata. Preserves Load Focus v1, Strain, ACWR, Ramp, CTL/ATL/TSB, Gear v2 usage, recent Gear activity support and device battery diagnostics."

      - name: Remove one-shot workflow
        run: |
          rm .github/workflows/release-probe17.yml
          git add -A
          git commit -m 'chore: remove probe .17 release workflow'
          git push origin feature/garmin-fitness
