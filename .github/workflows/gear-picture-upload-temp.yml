name: Garmin Gear picture upload temp

on:
  push:
    branches:
      - feature/garmin-gear
    paths:
      - .gear-picture-upload-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/garmin-gear
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Add Gear picture websocket backend
        shell: bash
        run: |
          cat > custom_components/garmin_connect/gear_picture.py <<'PY'
          """Local product-picture management for Garmin Gear."""

          from __future__ import annotations

          import base64
          import binascii
          import re
          import unicodedata
          from pathlib import Path
          from typing import Any

          import voluptuous as vol

          from homeassistant.components import websocket_api
          from homeassistant.core import HomeAssistant, callback

          from .const import DOMAIN

          WS_UPLOAD_GEAR_PICTURE = f"{DOMAIN}/gear_picture/upload"
          WS_REMOVE_GEAR_PICTURE = f"{DOMAIN}/gear_picture/remove"
          MAX_PICTURE_BYTES = 5 * 1024 * 1024
          PICTURE_EXTENSIONS = ("jpeg", "jpg", "png", "webp")

          _MIME_TO_EXTENSION = {
              "image/jpeg": "jpeg",
              "image/jpg": "jpeg",
              "image/png": "png",
              "image/webp": "webp",
          }
          _DATA_REGISTERED = f"{DOMAIN}_gear_picture_websocket_registered"


          def slugify_gear_picture_name(value: str) -> str:
              """Return the canonical local picture slug for a Gear display name."""
              normalized = unicodedata.normalize("NFKD", value)
              ascii_value = "".join(char for char in normalized if not unicodedata.combining(char))
              slug = re.sub(r"[^a-z0-9]+", "_", ascii_value.lower()).strip("_")
              return re.sub(r"_+", "_", slug)


          def _validate_picture_bytes(data: bytes, extension: str) -> None:
              """Validate the minimal image signature before writing a file."""
              valid = False
              if extension == "jpeg":
                  valid = data.startswith(b"\xff\xd8\xff")
              elif extension == "png":
                  valid = data.startswith(b"\x89PNG\r\n\x1a\n")
              elif extension == "webp":
                  valid = len(data) >= 12 and data[:4] == b"RIFF" and data[8:12] == b"WEBP"
              if not valid:
                  raise ValueError("Bildens innehåll matchar inte filformatet")


          def decode_gear_picture(content: str, mime_type: str) -> tuple[str, bytes]:
              """Decode and validate a base64 encoded Gear picture."""
              extension = _MIME_TO_EXTENSION.get(mime_type.lower())
              if extension is None:
                  raise ValueError("Endast JPEG, PNG och WebP stöds")
              try:
                  data = base64.b64decode(content, validate=True)
              except (binascii.Error, ValueError) as err:
                  raise ValueError("Ogiltig bilddata") from err
              if not data:
                  raise ValueError("Bildfilen är tom")
              if len(data) > MAX_PICTURE_BYTES:
                  raise ValueError("Bildfilen är större än 5 MB")
              _validate_picture_bytes(data, extension)
              return extension, data


          def _picture_directory(hass: HomeAssistant) -> Path:
              return Path(hass.config.path("www", "gear_pictures"))


          def write_gear_picture(directory: Path, slug: str, extension: str, data: bytes) -> Path:
              """Write a picture atomically and remove stale extension variants."""
              directory.mkdir(parents=True, exist_ok=True)
              target = directory / f"{slug}.{extension}"
              temporary = directory / f".{slug}.{extension}.tmp"
              temporary.write_bytes(data)
              temporary.replace(target)

              for candidate_extension in PICTURE_EXTENSIONS:
                  candidate = directory / f"{slug}.{candidate_extension}"
                  if candidate != target:
                      candidate.unlink(missing_ok=True)
              return target


          def remove_gear_pictures(directory: Path, slug: str) -> list[str]:
              """Remove all supported picture variants for a Gear item."""
              removed: list[str] = []
              for extension in PICTURE_EXTENSIONS:
                  candidate = directory / f"{slug}.{extension}"
                  if candidate.exists():
                      candidate.unlink()
                      removed.append(candidate.name)
              return removed


          @callback
          def async_setup_gear_picture_websocket(hass: HomeAssistant) -> None:
              """Register Gear picture websocket commands once per HA runtime."""
              if hass.data.get(_DATA_REGISTERED):
                  return
              websocket_api.async_register_command(hass, websocket_upload_gear_picture)
              websocket_api.async_register_command(hass, websocket_remove_gear_picture)
              hass.data[_DATA_REGISTERED] = True


          @websocket_api.websocket_command(
              {
                  vol.Required("type"): WS_UPLOAD_GEAR_PICTURE,
                  vol.Required("name"): str,
                  vol.Required("mime_type"): str,
                  vol.Required("content"): str,
              }
          )
          @websocket_api.require_admin
          @websocket_api.async_response
          async def websocket_upload_gear_picture(
              hass: HomeAssistant,
              connection: websocket_api.ActiveConnection,
              msg: dict[str, Any],
          ) -> None:
              """Upload or replace a local Gear product picture."""
              slug = slugify_gear_picture_name(msg["name"])
              if not slug:
                  connection.send_error(msg["id"], "invalid_name", "Kunde inte skapa bildnamn")
                  return

              try:
                  extension, data = decode_gear_picture(msg["content"], msg["mime_type"])
              except ValueError as err:
                  connection.send_error(msg["id"], "invalid_picture", str(err))
                  return

              try:
                  target = await hass.async_add_executor_job(
                      write_gear_picture,
                      _picture_directory(hass),
                      slug,
                      extension,
                      data,
                  )
              except OSError as err:
                  connection.send_error(msg["id"], "save_failed", str(err))
                  return

              connection.send_result(
                  msg["id"],
                  {
                      "slug": slug,
                      "filename": target.name,
                      "url": f"/local/gear_pictures/{target.name}",
                  },
              )


          @websocket_api.websocket_command(
              {
                  vol.Required("type"): WS_REMOVE_GEAR_PICTURE,
                  vol.Required("name"): str,
              }
          )
          @websocket_api.require_admin
          @websocket_api.async_response
          async def websocket_remove_gear_picture(
              hass: HomeAssistant,
              connection: websocket_api.ActiveConnection,
              msg: dict[str, Any],
          ) -> None:
              """Remove local Gear product-picture variants."""
              slug = slugify_gear_picture_name(msg["name"])
              if not slug:
                  connection.send_error(msg["id"], "invalid_name", "Kunde inte skapa bildnamn")
                  return

              try:
                  removed = await hass.async_add_executor_job(
                      remove_gear_pictures,
                      _picture_directory(hass),
                      slug,
                  )
              except OSError as err:
                  connection.send_error(msg["id"], "remove_failed", str(err))
                  return

              connection.send_result(msg["id"], {"slug": slug, "removed": removed})
          PY

          python3 <<'PY'
          from pathlib import Path
          import json

          init_path = Path("custom_components/garmin_connect/__init__.py")
          text = init_path.read_text()
          import_anchor = "from .gear_sensor import async_add_gear_sensor_entities\n"
          import_line = "from .gear_picture import async_setup_gear_picture_websocket\n"
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit("gear_sensor import anchor not found")
              text = text.replace(import_anchor, import_line + import_anchor, 1)

          call_anchor = "    await async_add_gear_sensor_entities(hass, entry, coordinators.gear)\n"
          call_line = "    async_setup_gear_picture_websocket(hass)\n"
          if call_line not in text:
              if call_anchor not in text:
                  raise SystemExit("gear sensor setup anchor not found")
              text = text.replace(call_anchor, call_anchor + call_line, 1)
          init_path.write_text(text)

          manifest_path = Path("custom_components/garmin_connect/manifest.json")
          manifest = json.loads(manifest_path.read_text())
          manifest["version"] = "3.0.25-gear-pictures-dev.1"
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")
          PY

          cat > tests/test_gear_picture.py <<'PY'
          """Tests for local Garmin Gear product-picture helpers."""

          import base64
          from pathlib import Path

          import pytest

          from custom_components.garmin_connect.gear_picture import (
              decode_gear_picture,
              remove_gear_pictures,
              slugify_gear_picture_name,
              write_gear_picture,
          )


          def test_slugify_gear_picture_name() -> None:
              assert slugify_gear_picture_name("Bianchi Impulso Comp") == "bianchi_impulso_comp"
              assert slugify_gear_picture_name("fēnix 7 Pro Sapphire Solar") == "fenix_7_pro_sapphire_solar"
              assert slugify_gear_picture_name("Abilica Viktväst 1-10kg") == "abilica_viktvast_1_10kg"


          def test_decode_jpeg_picture() -> None:
              raw = b"\xff\xd8\xff" + b"garmin-gear"
              extension, decoded = decode_gear_picture(
                  base64.b64encode(raw).decode(),
                  "image/jpeg",
              )
              assert extension == "jpeg"
              assert decoded == raw


          def test_decode_picture_rejects_mismatched_content() -> None:
              raw = b"not-a-png"
              with pytest.raises(ValueError, match="matchar inte"):
                  decode_gear_picture(base64.b64encode(raw).decode(), "image/png")


          def test_write_picture_removes_stale_extension(tmp_path: Path) -> None:
              stale = tmp_path / "nike_pegasus.jpg"
              stale.write_bytes(b"old")
              target = write_gear_picture(
                  tmp_path,
                  "nike_pegasus",
                  "jpeg",
                  b"\xff\xd8\xffnew",
              )
              assert target.name == "nike_pegasus.jpeg"
              assert target.read_bytes() == b"\xff\xd8\xffnew"
              assert not stale.exists()


          def test_remove_picture_variants(tmp_path: Path) -> None:
              for extension in ("jpeg", "png"):
                  (tmp_path / f"bontrager_ion_200_rt_flare.{extension}").write_bytes(b"x")
              removed = remove_gear_pictures(tmp_path, "bontrager_ion_200_rt_flare")
              assert sorted(removed) == [
                  "bontrager_ion_200_rt_flare.jpeg",
                  "bontrager_ion_200_rt_flare.png",
              ]
              assert list(tmp_path.iterdir()) == []
          PY

      - name: Remove one-shot files
        run: rm -f .github/workflows/gear-picture-upload-temp.yml .gear-picture-upload-trigger

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements_lint.txt

      - name: Pre-commit
        run: pre-commit run --all-files --hook-stage manual --config .github/pre-commit-config.yaml

      - name: Tests
        run: pytest tests/test_gear_picture.py tests/test_init.py -q

      - name: Commit clean Gear picture backend
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(gear): manage local product pictures"
          git push origin HEAD:feature/garmin-gear
